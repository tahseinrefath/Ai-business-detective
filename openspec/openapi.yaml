        schema:
          type: string
          title: Ds
      - name: metric
        in: query
        required: false
        schema:
          type: string
          default: profit
          title: Metric
      - name: previous
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
      - name: current
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Current
      responses:
        '200':
