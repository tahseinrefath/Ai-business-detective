components:
  schemas:
    AskRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        current:
          anyOf:
          - type: string
          - type: 'null'
          title: Current
        question:
          type: string
          title: Question
          default: ''
      type: object
      title: AskRequest
    Body_upload_api_upload_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
      type: object
      title: Body_upload_api_upload_post
    Body_upload_avatar_api_profile_avatar_post:
      properties:
        avatar:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Avatar
      type: object
      title: Body_upload_avatar_api_profile_avatar_post
    ColumnMappingRequest:
      properties:
        token:
          type: string
          title: Token
          default: ''
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        mapping:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          type: object
          title: Mapping
          default: {}
      type: object
      title: ColumnMappingRequest
    DeleteAccountRequest:
      properties:
        password:
          type: string
          title: Password
          default: ''
      type: object
      title: DeleteAccountRequest
    GoalDeleteRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
      type: object
      title: GoalDeleteRequest
    GoalSetRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        metric:
          type: string
          title: Metric
          default: ''
        amount:
          title: Amount
      type: object
      title: GoalSetRequest
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthResponse
    InvestigateRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        current:
          anyOf:
          - type: string
          - type: 'null'
          title: Current
      type: object
      title: InvestigateRequest
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
          default: ''
        password:
          type: string
          title: Password
          default: ''
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
      type: object
      title: LoginRequest
    NoteCreateRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        text:
          type: string
          title: Text
          default: ''
      type: object
      title: NoteCreateRequest
    PasswordChangeRequest:
      properties:
        current:
          type: string
          title: Current
          default: ''
        new:
          type: string
          title: New
          default: ''
      type: object
      title: PasswordChangeRequest
    ProfileUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        job_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Title
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
      type: object
      title: ProfileUpdateRequest
    RegisterRequest:
      properties:
        name:
          type: string
          title: Name
          default: ''
        email:
          type: string
          title: Email
          default: ''
        password:
          type: string
          title: Password
          default: ''
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
      type: object
      title: RegisterRequest
    ReportCreateRequest:
      properties:
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        current:
          anyOf:
          - type: string
          - type: 'null'
          title: Current
      type: object
      title: ReportCreateRequest
    SampleRequest:
      properties:
        kind:
          type: string
          title: Kind
          default: clean
      type: object
      title: SampleRequest
    WhatIfRequest:
      properties:
        dataset:
          type: string
          title: Dataset
          default: ''
        segment:
          type: string
          title: Segment
          default: ''
        commit:
          type: boolean
          title: Commit
          default: false
        order_change_pct:
          title: Order Change Pct
          default: 0
        price_change_pct:
          title: Price Change Pct
          default: 0
        margin_change_pts:
          title: Margin Change Pts
          default: 0
      type: object
      title: WhatIfRequest
    ErrorResponse:
      properties:
        error:
          title: Error
          type: string
        login_required:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Login Required
      required:
      - error
      title: ErrorResponse
      type: object
