<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle — Obsidian -->
  <circle cx="16" cy="16" r="16" fill="#1a1a2e"/>
  <!-- Magnifying glass handle — Laser accent -->
  <line x1="21" y1="21" x2="27" y2="27" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  <!-- Magnifying glass circle — Chrome -->
  <circle cx="14" cy="14" r="7" stroke="#e0e0e0" stroke-width="2.5" fill="none"/>
  <!-- Bar chart inside glass — Laser -->
  <rect x="10" y="15" width="2" height="3" rx="0.5" fill="#ff6b6b"/>
  <rect x="13" y="12" width="2" height="6" rx="0.5" fill="#ff6b6b"/>
  <rect x="16" y="13" width="2" height="5" rx="0.5" fill="#ff6b6b"/>
</svg>
